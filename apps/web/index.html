<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1B5E7B" />
    <meta name="description" content="Track item expiration dates and receive alerts" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Expiry Alert" />

    <!-- Icons -->
    <link rel="icon" href="/favicon-v2.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <link rel="mask-icon" href="/mask-icon-v2.svg" color="#1B5E7B" />

    <title>Item Expiry Tracker</title>
  </head>
  <body>
    <div id="root">
      <!-- Pre-React splash (removed once React mounts) -->
      <div id="splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;gap:16px">
        <!-- Same drawing as src/components/AnimatedLogo.tsx; the app's CSS is not loaded yet. -->
        <div style="position:relative;width:80px;height:80px">
          <img src="/logo-face-v1.png" alt="" width="80" height="80" />
          <svg viewBox="0 0 512 512" width="80" height="80" style="position:absolute;inset:0" aria-hidden="true">
            <g stroke="#064B75" stroke-width="10.5" stroke-linecap="round">
              <line class="splash-hand" x1="246.5" y1="273.5" x2="328" y2="226" style="animation:splashHand 1.6s ease-in-out infinite" />
              <line class="splash-hand" x1="246.5" y1="273.5" x2="300" y2="326" style="animation:splashHand 19.2s linear infinite" />
            </g>
            <circle cx="246.5" cy="273.5" r="16" fill="#064B75" />
          </svg>
        </div>
        <style>.splash-hand{transform-box:view-box;transform-origin:246.5px 273.5px}@keyframes splashHand{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.splash-hand{animation:none!important}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
